<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Coin Kombat</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку Telegram Web App API -->
    <script src="https://cdn.jsdelivr.net/npm/@telegram/wa-web-app-api@0.3.4/dist/telegram-wa-web-app.min.js"></script>
</head>
<body>
<div class="game-container">
    <h1>Coin Kombat</h1>
    
    <div class="stats">
        <div>Монеты: <span id="coins">0</span></div>
        <div>Доход в секунду: <span id="per-second">0</span></div>
        <div>Уровень тапа: <span id="tap-level">1x</span></div>
    </div>

    <div class="click-area" onclick="tapCoin()">
        <span id="tap-effect" class="tap-effect">+1</span>
        <img src="https://i.imgur.com/7XhZ0yR.png" alt="Tap the hamster" class="click-img">
    </div>

    <h2>Улучшить доход</h2>
    <div class="upgrades" id="upgrades">
        <!-- Биржи будут добавляться сюда скриптом -->
    </div>

    <button onclick="saveGame()">Сохранить прогресс</button>
</div>
<!-- Подключаем наш основной JS-код -->
<script src="script.js"></script>
</body>
</html>
